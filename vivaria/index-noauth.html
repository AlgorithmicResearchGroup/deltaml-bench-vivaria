    <!-- Patch to disable Auth0 -->
    <script>
      // Disable Auth0 by providing a mock implementation
      window.__USE_AUTH0__ = false;

      // Mock the Auth0 client to prevent errors
      window.createAuth0Client = async function() {
        console.log('Auth0 disabled - using mock client');
        return {
          isAuthenticated: async () => false,
          loginWithRedirect: async () => {
            console.log('Auth0 login disabled - not needed');
            return;
          },
          logout: () => console.log('Auth0 logout disabled'),
          getUser: async () => null,
          getIdTokenClaims: async () => null,
          getTokenSilently: async () => '',
          getAccessTokenSilently: async () => '',
          handleRedirectCallback: async () => ({}),
          checkSession: async () => {},
          getIdToken: async () => ''
        };
      };

      // Intercept any Auth0 SDK loading
      Object.defineProperty(window, 'Auth0Client', {
        get: function() {
          return function() {
            return window.createAuth0Client();
          };
        },
        set: function() {
          // Ignore attempts to set Auth0Client
        }
      });

      console.log('Auth0 disabled via patch');
    </script>
